name: Tracking QA

# Runs the tracking test suite against the live shop:
#  - on every push (catches broken tracking before anyone notices in the reports)
#  - daily at 06:17 UTC (catches changes made directly in GTM, outside the repo)
#  - manually from the Actions tab
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  tracking-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://gaurav-1410.github.io/server-side-tracking/
      # Repository → Settings → Secrets and variables → Actions → Variables → TAGGRS_HOST
      TAGGRS_HOST: ${{ vars.TAGGRS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Wait for GitHub Pages deployment (push only)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Run tracking tests
        working-directory: tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-qa-report
          path: tests/report.xml
