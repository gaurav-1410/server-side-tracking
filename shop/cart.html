<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart – Coffee House</title>
    <link rel="stylesheet" href="css/style.css" />

      });

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.1.0/dist/cookieconsent.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.1.0/dist/cookieconsent.umd.js"
    ></script>
    <script defer src="js/consent.js"></script>

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";

  <body data-page="cart">
    <!-- Google Tag Manager (noscript) -->

      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MQN3G5MZ"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header>
      <a class="logo" href="index.html">☕ Coffee House</a>
      <a href="cart.html">Cart (<span data-cart-count>0</span>)</a>
    </header>
    <main>
      <h1>Your cart</h1>
      <div id="cart-lines"></div>
      <p class="total">Total: <span id="cart-total">0,00 €</span></p>
      <button id="checkout-btn">Checkout</button>
    </main>
    <footer>
      <p>
        <strong>Get our newsletter</strong> – brewing tips and new beans every
        month.
      </p>
      <form id="newsletter">
        <input type="email" placeholder="you@example.com" required />
        <button type="submit">Subscribe</button>
      </form>
      <p class="note">
        Demo shop for a server-side tracking project. Use test data only – no
        real orders.
      </p>
    </footer>
    <script src="js/products.js"></script>
    <script src="js/tracking.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
